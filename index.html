<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Josh's Skate Odyssey 2.0</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#090512;font-family:Arial,sans-serif;color:#c77dff;user-select:none;-webkit-user-select:none;touch-action:none}
#g{position:relative;width:100%;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:8px;z-index:5;background:rgba(10,5,20,.85);border:2px solid #8e44ad;border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;line-height:1.5;min-width:150px}
#hd{font-size:11px;color:#9fe}
#saveWarn{font-size:11px;color:#ff9db0;font-weight:800}
.bar{height:9px;background:#25112f;border:1px solid #b56cff;border-radius:9px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8e44ad,#e056fd)}
#fb{background:linear-gradient(90deg,#3cf,#bff)!important}
#top{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:10;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:55%}
#menu{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button,.fb{border:1px solid #a855f7;background:#160b24;color:#e5b7ff;padding:8px 11px;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px;font-family:inherit}
button:hover{background:#35124f}
button:focus-visible,.fb:focus-within{outline:2px solid #ffd34d;outline-offset:2px}
button.on{background:#5b1f8a;border-color:#ffd34d}
button.danger{border-color:#ff4d6d;color:#ff9db0;background:#2a0a14}
button.danger:hover{background:#4a0f22}
button.big{font-size:20px;padding:14px 28px}
button:disabled{opacity:.5;cursor:default}
input[type=file]{display:none}
#md{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(5,2,12,.88)}
#pn{width:min(760px,92vw);max-height:88vh;overflow:auto;background:#120a1f;border:2px solid #a855f7;border-radius:20px;padding:22px;text-align:center;touch-action:pan-y;-webkit-overflow-scrolling:touch}
h1{font-size:clamp(26px,5vw,44px);margin:0 0 8px;color:#d18cff}
h2{color:#d18cff;margin-top:0}
p{color:#d9b9ed;margin:6px 0}
.ctl{font-size:13px}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;text-align:left;margin-top:12px}
.card{border:1px solid #5b2b73;border-radius:12px;padding:12px;background:#10071a}
.card.on{border-color:#d18cff;background:#210a33}
.card.lk{opacity:.55}
.card h3{margin:0 0 5px;color:#e4b4ff}
.card button{width:100%;margin-top:8px}
.price{color:#ffd34d;font-weight:900}
.row{margin:12px 0;text-align:left}
input[type=range]{width:55%;vertical-align:middle;accent-color:#a855f7}
table{width:100%;border-collapse:collapse;color:#e5b7ff}
td,th{padding:8px;border-bottom:1px solid #3a1650;text-align:left}
th{color:#ffd34d}
input[type=password]{width:80%;max-width:300px;padding:10px;border-radius:10px;border:2px solid #a855f7;background:#10071a;color:#fff;font-size:17px;text-align:center;margin:12px 0}
#tut{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:7;width:min(560px,92vw);background:rgba(18,10,31,.95);border:2px solid #ffd34d;border-radius:14px;padding:8px 14px;text-align:center;box-shadow:0 0 24px rgba(168,85,247,.5)}
#tut .ts{font-size:11px;font-weight:900;color:#ffd34d;letter-spacing:1px}
#tut .tt{font-size:15px;font-weight:700;color:#fff;margin:3px 0 7px;line-height:1.35}
#tut .tt b{color:#ffd34d}
#tut button{padding:5px 10px;font-size:12px}
#touch{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:8;display:none;gap:6px}
#touch button{min-width:48px;height:46px;padding:6px 8px;font-size:12px}
@media(pointer:coarse){
  #touch{display:flex;max-width:min(96vw,520px);flex-wrap:wrap;justify-content:center}
  #tut{bottom:auto;top:calc(168px + env(safe-area-inset-top,0px))}
}
@media(max-height:520px){
  #hud{font-size:11px;padding:5px 8px;min-width:130px;line-height:1.35}
  #top button,.fb{padding:6px 8px;font-size:12px}
  #touch button{height:40px}
  #tut{width:min(440px,46vw)}
  #tut .tt{font-size:12px}
}
@media(pointer:coarse) and (max-height:520px){
  #tut{bottom:auto;top:calc(8px + env(safe-area-inset-top,0px))}
}
</style>
</head>

</div>
<script>
"use strict";
/* =====================================================================
   JOSH'S SKATE ODYSSEY 2.0
   1 Helpers · 2 Data · 3 Save · 4 Audio · 5 State · 6 Input · 7 Tutorial

/* ---------- 1. HELPERS ---------- */
const $ = id => document.getElementById(id);
const cv = $("c"), ctx = cv.getContext("2d");
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtClock = n => { n = Math.max(0, Math.ceil(n)); return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0"); };
const rnd = (a, b) => a + Math.random() * (b - a);
const isTouch = matchMedia("(pointer:coarse)").matches;
let W = 0, H = 0;

// roundRect fallback for older browsers
if (typeof CanvasRenderingContext2D !== "undefined" && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(+r || 0, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
  };
}

/* ---------- 2. DATA ---------- */
const ABILITIES = [

const abilityDef = id => ABILITIES.find(a => a.id === id) || ABILITIES[0];
const CFG = { grav: .75, jump: 15, buf: 8, coyote: 7, cut: .82, multCap: 25 };

const LV = [
  { n: "Level 1 — High School Courtyard 🎒", s: 4,   a: "#29104f", b: "#0b102b", z: ["cone", "cone", "box", "rail", "ramp", "bird"] },
  { n: "Level 2 — Neon Downtown 🌃",         s: 4.7, a: "#3a145f", b: "#081a38", z: ["cone", "box", "drone", "drone", "copcar", "rail", "ramp"] },

  { n: "Level 7 — Shattered Colosseum 🏛️",   s: 8,   a: "#674134", b: "#180d17", z: ["spike", "fire", "box", "rail", "ramp", "drone"] },

  { n: "Level 9 — Infernal Foundry ⚒️",      s: 9,   a: "#9a2f16", b: "#230407", z: ["hellfire", "fire", "spike", "hellfire", "rail", "ramp"], hell: 1 },
  { n: "Level 10 — HEAVEN ☁️✨",              s: 7.6, a: "#fff7d1", b: "#a6e3e9", z: ["cloud", "cloud", "drone", "bird", "spike", "ramp"], h: 1 },
  { n: "Level 11 — HELL 🔥🌋",                s: 8.4, a: "#ff512f", b: "#240006", z: ["hellfire", "fire", "spike", "hellfire", "rail", "ramp"], hell: 1 }
];
const NORMAL_LEVELS = 9, HEAVEN_LEVEL = 10, HELL_LEVEL = 11;
const LVN = [0, 2500, 7000, 14000, 23000, 35000, 55000];   // legacy score milestones for old saves
const BOSS_TRAVEL_SECONDS = 30; // active play time before each run's boss
const NAETO_TRAVEL_SECONDS = 10; // active play time in Hell before Naeto appears
const BS = [["Bully Brad", "😡"], ["Chief Cop Car", "🚔"], ["Mecha Ramp", "🤖"], ["Purple Dragon", "🐉"], ["Golden Guardian", "🗿"], ["Thunder Bruiser", "🌩️"], ["Wraith Racer", "🏎️"], ["Volcano Golem", "🌋"], ["Storm Colossus", "⛈️"], ["Fallen Angel", "😈"]];
const nextBossIndex = () => Math.min(save.rebirths, BS.length - 1);
const maxAirJumps = () => save.rebirths >= 5 ? Infinity : save.rebirths >= 3 ? 3 : save.rebirths >= 1 ? 2 : 1;
// obstacle types: [width, height, y-offset from ground, emoji]
const TY = {
  rail: [220, 32, 40, ""], box: [80, 90, 10, "📦"], bird: [60, 60, -130, "🐦"], cone: [55, 60, 40, "🚧"],
  copcar: [140, 65, 26, "🚓"], ramp: [160, 45, 55, ""], drone: [60, 50, -90, "🛸"], spike: [110, 40, 47, "🔺"],
  fire: [50, 120, -20, "🔥"], hellfire: [72, 145, -25, "🔥"], cloud: [90, 55, -100, "⛈️"], shot: [44, 44, 0, "💥"]
};
const DF = {
  chill:  { spd: .9,  gap: 1.25, lives: 8, pts: .8,  label: "😌 Chill" },
  normal: { spd: 1.1, gap: 1,    lives: 4, pts: 1,   label: "😎 Normal" },
  hard:   { spd: 1.3, gap: .75,  lives: 3, pts: 1.5, label: "💀 Hard" }
};
// skaters: id, rebirths needed, name, perk, shirt, font, aura, hair, points bonus, coin bonus, extra jump power
const RO = [
  ["sami", 3, "Sami", "High-Flyer (+15% jump)", "#e74c3c", "#ff6b6b", "rgba(255,107,107,.6)", "#111", 1, 1, 2.25],
  ["patrick", 0, "Patrick", "Fast boost charge", "#2ecc71", "#2edf71", "rgba(46,223,113,.6)", "#d4ac0d", 1, 1, 0],
  ["zaraiji", 0, "Zaraiji", "Combo Master", "#3498db", "#00d2ff", "rgba(0,210,255,.6)", "#2c3e50", 1.1, 1, 0],
  ["adam", 0, "Adam", "Bail Insurance (-50%)", "#f39c12", "#f1c40f", "rgba(241,196,15,.6)", "#7f8c8d", 1, 1, 0],
  ["callum", 0, "Callum", "Golden Touch (+100% coins)", "#f1c40f", "#ffd700", "rgba(255,215,0,.6)", "#e67e22", 1, 2, 0],
  ["eric", 0, "Eric", "Speed Demon (+10%)", "#9b59b6", "#e056fd", "rgba(224,86,253,.6)", "#34495e", 1.05, 1, 0],
  ["suwhan", 0, "Suwhan", "Clean Landing (+500)", "#1abc9c", "#00cec9", "rgba(0,206,201,.6)", "#16a085", 1.1, 1.1, 0],
  ["jasper", 1, "Jasper", "Holy Grace (+50% flying pts)", "#34495e", "#74b9ff", "rgba(116,185,255,.6)", "#f39c12", 1.3, 1.2, 1.5],
  ["gabriel", 2, "Gabriel", "Infinite heaven boost & fuel", "#00cec9", "#81ecec", "rgba(129,236,236,.7)", "#ffeaa7", 1.25, 1.5, 2],
  ["josh", 4, "Josh", "👑 GODFATHER (+150% pts & coins)", "#7b3fb3", "#ffd700", "rgba(255,215,0,.85)", "#4b2414", 2.5, 2.5, 4]
].map(a => ({ id: a[0], req: a[1], name: a[2], perk: a[3], shirt: a[4], font: a[5], aura: a[6], hair: a[7], pm: a[8], cm: a[9], jb: a[10] }));

// shop: id, slot, name, cost, description, value
const CAT = [
  ["board_basic", "board", "Starter Board", 0, "Maple deck", 1],
  ["board_purple", "board", "Purple Phantom", 250, "+8% speed", 1.08],
  ["board_neon", "board", "Neon Rocket", 600, "+18% speed", 1.18],
  ["board_dragon", "board", "Neon Dragon", 2500, "+25% speed", 1.25],
  ["board_gold", "board", "Golden Limon", 12000, "+35% speed", 1.35],
  ["board_mafia", "board", "Mafia Gold Executive", 75000, "+60% speed", 1.6],
  ["hat_basic", "hat", "No Hat", 0, "Classic", 1],
  ["hat_purple", "hat", "Purple Cap", 180, "+5% points", 1.05],
  ["hat_fedora", "hat", "Mafia Fedora", 1500, "+10% points", 1.1],
  ["hat_crown", "hat", "Mini Crown", 7000, "+12% points", 1.12],
  ["hat_godfather", "hat", "Godfather Crown", 50000, "+25% points", 1.25],
  ["hat_durag", "hat", "Naeto's Durag", 0, "Naeto's black durag · earned by defeating him", 1],
  ["shoes_basic", "shoes", "Starter Shoes", 0, "Landing x1", 1],
  ["shoes_neon", "shoes", "Neon Kicks", 300, "+7% landing", 1.07],
  ["shoes_gold", "shoes", "Gold Kicks", 9000, "+16% landing", 1.16],

  ["outfit_italian_mafia", "outfit", "🇮🇹 Italian Mafia Trench", 500000, "+200% points!", 3]
].map(a => ({ id: a[0], slot: a[1], name: a[2], cost: a[3], desc: a[4], v: a[5] }));
const IC = { board: "🛹", hat: "🎩", shoes: "👟", jewelry: "⛓️", outfit: "🥋" };
const A = {
  boss: "🥊 Defeat your first boss", heaven: "☁️ Reach Heaven", stomp: "👟 Stomp 10 bullies", lem: "💵 Collect 100 cash pickups",
  c10: "🔥 Hit combo x10", reb: "🔄 Rebirth", b5: "💀 Defeat 5 bosses"
};
const CHL = [["Land 5 kickflips", "kick", 5], ["Stomp 3 bullies", "stomp", 3], ["Collect 40 cash pickups", "cash", 40],
  ["Defeat a boss", "boss", 1], ["Reach Level 3", "lvl", 3], ["Land 15 clean landings", "clean", 15]];

/* ---------- 3. SAVE SYSTEM ---------- */
const SAVE_KEY = "jso5", LEGACY_KEYS = ["josh_skate_save_v4"];
const localDate = () => {
  const n = new Date();
  return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0");
};
let today = localDate();
const defaultSave = () => ({
  coins: 0, rebirths: 0, ability: "boost", abilities: ["boost"], stageVersion: 2,
  owned: ["board_basic", "hat_basic", "shoes_basic", "chain_basic"],
  eq: { board: "board_basic", hat: "hat_basic", shoes: "shoes_basic", jewelry: "chain_basic", outfit: "none" },
  sel: "patrick", hs: {}, cJ: 0, cS: 0, jOn: 0, sOn: 0, diff: "normal", seen: 0, ach: {},
  tot: { stomp: 0, lem: 0, boss: 0 }, daily: { d: "", p: 0, done: 0 }, cp: { level: 1, score: 0 },
  muted: 0, vm: 1, vs: 1, fx: matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : 0, photo: "", completedGame: 0, naetoDefeated: 0
});
let save = defaultSave(), dirty = false, noSave = false, storageError = false;

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY) || localStorage.getItem(LEGACY_KEYS[0]);
    if (!raw) return;
    const l = JSON.parse(raw), d = defaultSave();
    save = { ...d, ...l };
    if (l.infiniteMoney) save.coins = Math.min(1000000, Math.max(0, +l.coins || 0));
    delete save.infiniteMoney;
    save.eq = { ...d.eq, ...(l.eq || l.equipped || {}) };
    save.hs = { ...(l.hs || l.highScores || {}) };
    save.abilities = Array.isArray(l.abilities) ? [...new Set(["boost", ...l.abilities.filter(id => ABILITIES.some(a => a.id === id))])] : ["boost"];
    save.ability = save.abilities.includes(l.ability) ? l.ability : "boost";
    save.sel = l.sel || l.selectedChar || "patrick";
    save.cJ = l.cJ || l.cheatJosh || 0;
    save.cS = l.cS || l.cheatSami || 0;
    if (!l.eq && l.equipped && l.equipped.outfit === "outfit_josh_cheat") save.jOn = 1;
    save.tot = { ...d.tot, ...l.tot };
    save.cp = { ...(l.cp || d.cp) };
    if (!l.stageVersion) {
      if (save.completedGame && save.cp.level === 7) save.cp.level = HELL_LEVEL;
      else if (save.cp.level === 6) save.cp.level = HEAVEN_LEVEL;
      save.stageVersion = 2;
    }
    save.naetoDefeated = l.naetoDefeated ? 1 : 0;
    save.daily = l.daily || d.daily;
    save.ach = l.ach || {};
    if (!Array.isArray(save.owned)) save.owned = d.owned;
    // migrate old high scores (one number per skater) into "skater:normal"
    for (const k of Object.keys(save.hs)) {
      if (!k.includes(":")) { save.hs[k + ":normal"] = Math.max(save.hs[k + ":normal"] || 0, save.hs[k]); delete save.hs[k]; }
    }
  } catch (e) { storageError = true; /* corrupt or unavailable save: start fresh */ }
}
const saveGame = () => {
  dirty = false;
  if (noSave) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); storageError = false; } catch (e) { storageError = true; dirty = true; }
  const warning = $("saveWarn"); if (warning) warning.classList.toggle("hidden", !storageError);
};
function refreshDaily() {
  const t = localDate();
  if (save.daily.d !== t) { today = t; save.daily = { d: t, p: 0, done: 0 }; dirty = true; }
  today = t;
}
const dqi = () => [...today].reduce((a, c) => a + c.charCodeAt(0), 0) % CHL.length;

// cheat passwords are stored as hashes (not readable in the source)

  noSave = true;
  try { localStorage.removeItem(SAVE_KEY); LEGACY_KEYS.forEach(k => localStorage.removeItem(k)); } catch (e) {}
  save = defaultSave(); today = localDate(); save.daily = { d: today, p: 0, done: 0 };
  G.img = null; G.overInfo = null; G.home = "start"; G.running = false; G.userPaused = false; keys = {};
  noSave = false; saveGame();
  syncMute(); resetGame();
  startScreen("✅ Everything was erased — fresh start!");
}

/* click / input delegation (no inline handlers) */
const ACTIONS = {
  play, go: () => go(false), cont: () => go(true), shop: () => shop(), pause, fs, mute: () => setMuted(!save.muted), muteS: () => { setMuted(!save.muted); settings(); },
  menu: () => $("menu").classList.toggle("hidden"), guide, ability: selectAbility, rebirth, hellHub, hellReturn: returnToHell, hellRun: replayHellLevel, hellBoss: replayHellBoss, hellFinal: replayFinalBoss, hellSky: replayHeaven, cheatUI: () => cheatUI(), cheatMoney, cheatBoss: cheatSkipBoss, cheatHeaven: cheatSkipHeaven, roster, scores: v => scores(v), goals, settings,
  tutorial: () => startTutorial(), tutSkip: endTutorial, tutDone: endTutorial, resetAsk, resetDo: fullReset, back,
  setD: v => setDiff(v), eq: v => equip(v), sel: v => selectSkater(v), tg: v => toggleCheat(v), cheat, fx: toggleFx, photoOff: removePhoto
};
document.addEventListener("click", e => {
  const btn = e.target.closest && e.target.closest("button");
  const el = e.target.closest && e.target.closest("[data-a]");
  if (el && ACTIONS[el.dataset.a]) ACTIONS[el.dataset.a](el.dataset.v);
  if (btn && btn.blur) btn.blur();                 // stops Space from re-pressing the last clicked button
});
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.in;
  if (k === "vm" || k === "vs") { save[k] = +e.target.value; dirty = true; }
});
document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.in;
  if (k === "vs") SFX.coin();
});
$("ph").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const i = new Image();
    i.onload = () => {
      const c = document.createElement("canvas"); c.width = c.height = 64;
      const s = Math.min(i.width, i.height);
      c.getContext("2d").drawImage(i, (i.width - s) / 2, (i.height - s) / 2, s, s, 0, 0, 64, 64);
      save.photo = c.toDataURL("image/jpeg", .8); setPhoto(save.photo); saveGame(); toast("PHOTO EQUIPPED! 📸");
    };
    i.src = r.result;
  };
  r.readAsDataURL(f);
};
document.addEventListener("visibilitychange", () => {
  keys = {};
  if (document.hidden && G.running && !G.modal) pause(); else if (!document.hidden) initAudio();
});
["pointerdown", "keydown", "touchstart"].forEach(ev => addEventListener(ev, initAudio, { passive: true }));

/* ---------- 13. BOOT ---------- */
loadSave();
if (storageError) $("saveWarn").classList.remove("hidden");
if (!item(save.eq.outfit)) save.eq.outfit = "none";
refreshDaily();
addEventListener("resize", resize);
setInterval(() => { if (dirty) saveGame(); }, 3000);
addEventListener("pagehide", saveGame);
resize(); resetGame(); setPhoto(save.photo); syncMute(); startScreen();
last = performance.now(); requestAnimationFrame(loop); music();
</script>
</body>
</html>
